name: Foundation contract snapshots
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/check_foundation_contracts.py
